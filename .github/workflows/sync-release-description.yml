name: Sync release description once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-release-description.yml'

permissions: {}

concurrency:
  group: tingyi-release-description
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'yachael/Tingyi' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Sync the approved release description'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update the published description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = "yachael/Tingyi"
          url = f"https://api.github.com/repos/{repo}/releases/391636510"
          headers = {
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "Tingyi-release-description",
          }
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              release = json.load(response)
          assert release["tag_name"] == "v0.2.5-preview" and not release["draft"]
          before = [(a["id"], a["name"], a["size"], a["digest"]) for a in release["assets"]]
          assert any(a["name"] == "Tingyi-Windows-x64-0.2.5-preview.exe" and a["digest"] == "sha256:4d8bda413dfe9b2085e5344a9621e38439a4c4fc948a668fd07de31cd0c0befa" for a in release["assets"])
          raw = f"https://raw.githubusercontent.com/{repo}/{os.environ['GITHUB_SHA']}/docs/RELEASE-NOTES-0.2.5.md"
          with urllib.request.urlopen(raw, timeout=30) as response:
              body = response.read().decode("utf-8-sig").strip()
          assert body.startswith("# Tingyi 0.2.5")
          payload = json.dumps({"body": body}).encode("utf-8")
          request = urllib.request.Request(url, data=payload, headers={**headers, "Content-Type": "application/json"}, method="PATCH")
          with urllib.request.urlopen(request, timeout=30) as response:
              updated = json.load(response)
          assert updated["body"] == body
          assert [(a["id"], a["name"], a["size"], a["digest"]) for a in updated["assets"]] == before
          print("Published release description updated.")
          PY
